# Cross-platform verification for daruma: the plugin ships to Windows, Linux and
# macOS, so every gate runs on all three (and on the two supported Node lines),
# with the failover end-to-end check running against real DSH hosts on the
# POSIX runners.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace packages resolve each other through their built `lib/`
      # (`daruma-core` types and runtime live there), so build before any
      # type-level gate.
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test
      - name: BOM guard
        run: pnpm run check:no-bom

  e2e:
    name: failover e2e (${{ matrix.os }}, dsh ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dsh: ['0.1.0-rc.7', '0.1.5-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build daruma
        run: pnpm run build
      - name: Install the DSH host
        run: npm install --global @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Failover end-to-end
        run: node scripts/e2e-failover.mjs
        env:
          DSH_BIN: dsh
