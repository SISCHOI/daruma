# Cross-platform verification for daruma: the plugin ships to Windows, Linux and
# macOS, so every gate runs on all three (and on the two supported Node lines),
# with the failover end-to-end check running against real DSH hosts on the
# POSIX runners.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace packages resolve each other through their built `lib/`
      # (`daruma-core` types and runtime live there), so build before any
      # type-level gate.
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test
      - name: BOM guard
        run: pnpm run check:no-bom

  e2e:
    name: failover e2e (${{ matrix.os }}, dsh ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dsh: ['0.1.0-rc.7', '0.1.5-rc.2', '0.2.0-rc.2', '0.2.1-alpha.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build daruma
        run: pnpm run build
      # The host goes into a throwaway project instead of a global install so
      # its transitive versions can be pinned per line. The 0.1.x hosts resolve
      # `cordis`, its loader, timer and HMR through caret ranges that now pick
      # the 2026-09-22 batch; that batch refuses to start the HMR service
      # without Node's `--expose-internals`, which the CLI never passes, so the
      # host dies inside profile boot — before any task runs, and before daruma
      # is exercised. Those hosts were validated against the previous batch, so
      # hold them there.
      - name: Prepare the host project
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p dsh-host && cd dsh-host
          npm init -y > /dev/null
          npm pkg set "dependencies.@deepseek-ai/dsh=${{ matrix.dsh }}"
          if [[ "${{ matrix.dsh }}" == 0.1.* ]]; then
            npm pkg set 'overrides.@deepseek-ai/cordis=4.0.2'
            npm pkg set 'overrides.@deepseek-ai/cordis-plugin-loader=1.0.3'
            npm pkg set 'overrides.@deepseek-ai/cordis-plugin-timer=1.1.4'
            npm pkg set 'overrides.@deepseek-ai/cordis-plugin-hmr=1.0.17'
          fi
          cat package.json
      - name: Install the DSH host
        working-directory: ${{ runner.temp }}/dsh-host
        env:
          # Resolving the pinned 0.1.x tree costs npm more than its 2 GB default
          # heap on the macOS arm64 runners: one 0.1.0-rc.7 job died with
          # "JavaScript heap out of memory" after five minutes of install. The
          # second run covers a runner that still manages to abort.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm install --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Failover end-to-end
        run: node scripts/e2e-failover.mjs --dsh "${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js"
      - name: Failover end-to-end (user backup channel)
        run: node scripts/e2e-failover.mjs --dsh "${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" --backup
